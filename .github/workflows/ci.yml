name: CI

on:
  push:
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SmartLawyer.slnx
      - run: dotnet build SmartLawyer.slnx --no-restore -c Release
      - run: dotnet test SmartLawyer.slnx --no-build -c Release
