# نشر نسخة عرض ثابتة من الموقع (ببيانات تجريبية) على GitHub Pages مع كل push على main.
# البحث الذكي وتسجيل الدخول محتاجين سيرفر، فمش متفعّلين في النسخة دي.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # الملفات دي محتاجة سيرفر، فبتتشال من نسخة العرض الثابتة بس.
      - run: rm -rf src/proxy.ts src/app/auth
      - run: npm run build
        env:
          STATIC_EXPORT: "1"
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
